name: Build Players Ratings

on:
  schedule:
    # Runs daily at 7 AM UTC (3 AM EST), staggered after the tournament scrape.
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-players:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit players.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build players.json
        run: python -m pipeline.build_players --roster roster.json --out players.json

      - name: Commit players.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          if git diff --staged --quiet; then
            echo "No changes to players.json"
          else
            git commit -m "chore: update players.json [skip ci]"
            git push
          fi
